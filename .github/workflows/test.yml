name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git jq inotify-tools
      - name: Run helper tests
        run: tests/run.sh
